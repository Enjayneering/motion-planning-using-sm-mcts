[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-mcts-jax"
version = "0.1.0"
description = "Real-time multi-agent motion planning with simultaneous-move MCTS in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enjayneering" }]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
cuda = ["jax[cuda12]>=0.4.30"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools.packages.find]
include = ["sm_mcts_jax*", "sm_mcts_web*"]

[tool.setuptools.package-data]
sm_mcts_web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
